<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard · Hygie Race 4</title>
<meta property="og:title" content="Leaderboard · Hygie Race 4">
<meta property="og:description" content="Le classement en direct de la Hygie Race 4, dimanche 4 octobre 2026.">
<meta property="og:image" content="https://crossfithygie-collab.github.io/Hygieborne/race4-logo.png">

<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,600;0,700;0,800;0,900;1,800;1,900&family=Permanent+Marker&display=swap" rel="stylesheet">
<link rel="stylesheet" href="race4.css?v=4">
<style>
 .barre{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
 .barre button{font-family:inherit;font-size:12px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;padding:9px 14px;border-radius:99px;cursor:pointer;
  border:1.5px solid rgba(255,255,255,.22);background:transparent;color:inherit}
 .barre button[aria-pressed=true]{background:#fff;color:#1800AD;border-color:#fff}
 .maj{font-size:12.5px;opacity:.7;margin:0 0 18px}
 .cat{margin:0 0 30px}
 .cat h2{font-size:14px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;
  margin:0 0 10px;padding-bottom:7px;border-bottom:2px solid currentColor}
 .lg{width:100%;border-collapse:collapse;font-size:15px}
 .lg th{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  text-align:left;padding:6px 8px;opacity:.6}
 .lg td{padding:9px 8px;border-bottom:1px solid rgba(255,255,255,.12);vertical-align:top}
 .lg td.r{width:38px;font-size:19px;font-weight:900;text-align:center}
 .lg tr.podium td.r{color:#FFD166}
 .lg td.e{font-weight:800;overflow-wrap:anywhere}
 .lg td.e span{overflow-wrap:anywhere}
 .lg td.e span{display:block;font-weight:400;font-size:12.5px;opacity:.72;margin-top:2px}
 .lg td.t{text-align:right;white-space:nowrap;font-weight:900;font-size:17px;
  font-variant-numeric:tabular-nums;width:92px}
 .lg td.t small{display:block;font-size:11px;font-weight:600;opacity:.7}
 .lg tr.attente td{opacity:.5}
 .vide{font-size:14px;opacity:.7;padding:10px 0}

 /* Mode televiseur : ?tv=1. On vise un ecran a trois metres, pas un telephone.
    Les Chromecast rognent les bords, et contre ca il faut reduire l'image, pas
    poser une marge : d'ou le scale sur la page entiere. */
 body.tv{overflow:hidden}
 /* Sur la TV, le classement et rien d'autre : ni logo, ni titre, ni menu. */
 body.tv .nav,body.tv .foot,body.tv .barre,body.tv .logo-wrap,
 body.tv .hero,body.tv .frame{display:none}
 body.tv .wrap{transform:scale(.93);transform-origin:top center;
   max-width:none;width:100%;padding:26px 34px 0}
 body.tv .maj{font-size:15px;margin:0 0 12px;opacity:.55;text-align:left}
 body.tv #classement{transform-origin:top left}
 body.tv .cat h2,body.tv .lg td.e{text-align:left}

 body.tv #classement{display:grid;grid-template-columns:1fr 1fr;gap:0 44px;
   align-content:start}
 body.tv .cat{margin:0 0 18px;break-inside:avoid}
 body.tv .cat h2{font-size:21px;letter-spacing:.14em;margin:0 0 6px;padding-bottom:6px}
 body.tv .lg{font-size:24px}
 body.tv .lg th{display:none}
 body.tv .lg td{padding:9px 6px}
 body.tv .lg td.r{width:52px;font-size:28px}
 body.tv .lg td.e{font-size:25px}
 body.tv .lg td.e span{font-size:17px;margin-top:1px}
 body.tv .lg td.t{font-size:27px;width:132px}
 body.tv .lg td.t small{font-size:15px}
 body.tv .vide{font-size:19px}
 /* Une seule categorie a l'ecran quand elles defilent : plein cadre. */
 body.tv.solo #classement{grid-template-columns:1fr}
 body.tv.solo .cat h2{font-size:30px}
 body.tv.solo .lg{font-size:34px}
 body.tv.solo .lg td.r{width:72px;font-size:40px}
 body.tv.solo .lg td.e{font-size:35px}
 body.tv.solo .lg td.e span{font-size:22px}
 body.tv.solo .lg td.t{font-size:38px;width:190px}
 body.tv.solo .lg td.t small{font-size:19px}
</style>
</head>
<body>
<div class="frame"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>

<nav class="nav">
  <ul>
    <li><a href="index.html">Accueil</a></li>
    <li><a href="race4-juges.html">Juges</a></li>
    <li><a href="race4-leaderboard.html" class="active">Leaderboard</a></li>
  </ul>
</nav>

<div class="wrap">
  <div class="logo-wrap anim" style="animation-delay:.05s"><img class="logo" src="race4-logo.png" alt="RAC4 · CrossFit Hygie"></div>

  <div class="hero">
    <span class="stamp">04 · 10 · 26</span>
    <h1>Leaderboard</h1>
  </div>

  <p class="maj" id="maj">Chargement du classement…</p>
  <div class="barre" id="barre"></div>
  <div id="classement"></div>

  <div class="foot"><a href="index.html">← Retour à l'accueil</a><br><br>
    CrossFit Hygie · 257 rue de l'industrie, 59113 Seclin</div>
</div>

<script>
// L'ordre d'affichage des categories, du duo au solo.
var ORDRE = ['FF OPEN','FF PRO','HH OPEN','HH PRO','HF MIXTE',
             'Femme Open','Femme Pro','Homme Open','Homme Pro'];
var filtre = 'tout', donnees = null;

function secondes(t){            // "72:14" ou "1:12:14" -> secondes
  var p = String(t).split(':').map(Number);
  if (p.some(isNaN)) return null;
  return p.length === 3 ? p[0]*3600 + p[1]*60 + p[2] : p[0]*60 + p[1];
}

function rang(a, b){
  // Celui qui franchit la ligne passe toujours devant celui qui est au cap.
  var ta = secondes(a.temps), tb = secondes(b.temps);
  if (ta !== null && tb !== null) return ta - tb;
  if (ta !== null) return -1;
  if (tb !== null) return 1;
  // Au cap : le plus de reps devant. Sans score : a la fin.
  var ra = a.reps == null ? -1 : a.reps, rb = b.reps == null ? -1 : b.reps;
  return rb - ra;
}

function court(n){
  // Un nom d'equipe a rallonge deborde sur telephone : on le coupe proprement.
  n = n || '—';
  return n.length > 38 ? n.slice(0, 36).trim() + '…' : n;
}

function peindre(){
  var d = donnees.resultats.slice();
  var cats = ORDRE.filter(function(c){
    return d.some(function(r){ return r.categorie === c; });
  });
  d.forEach(function(r){ if (cats.indexOf(r.categorie) < 0) cats.push(r.categorie); });

  // Les boutons de filtre
  var b = document.getElementById('barre');
  if (!b.children.length){
    ['tout'].concat(cats).forEach(function(c){
      var bt = document.createElement('button');
      bt.textContent = c === 'tout' ? 'Toutes' : c;
      bt.setAttribute('aria-pressed', c === filtre);
      bt.onclick = function(){
        filtre = c;
        [].forEach.call(b.children, function(x){
          x.setAttribute('aria-pressed', x.textContent === (c === 'tout' ? 'Toutes' : c));
        });
        peindre();
      };
      b.appendChild(bt);
    });
  }

  var sortie = '';
  cats.forEach(function(c){
    if (filtre !== 'tout' && filtre !== c) return;
    var lot = d.filter(function(r){ return r.categorie === c; }).sort(rang);
    var lignes = '';
    var place = 0;
    lot.forEach(function(r){
      var fini = secondes(r.temps) !== null, cap = r.reps != null;
      if (fini || cap) place++;
      var score = fini ? r.temps
                : cap ? '<span>CAP</span><small>' + r.reps + ' reps</small>'
                : '—';
      lignes += '<tr class="' + (fini && place <= 3 ? 'podium' : '')
             + (fini || cap ? '' : ' attente') + '">'
             + '<td class="r">' + (fini || cap ? place : '·') + '</td>'
             + '<td class="e" title="' + ((r.nom_complet || r.equipe || '').replace(/"/g, '')) + '">' + court(r.equipe)
             + '<span>' + (r.athletes || []).join(' · ') + '</span></td>'
             + '<td class="t">' + score + '</td></tr>';
    });
    sortie += '<div class="cat"><h2>' + c + '</h2>'
            + (lot.length
               ? '<table class="lg"><thead><tr><th></th><th>Équipe</th>'
                 + '<th style="text-align:right">Temps</th></tr></thead>'
                 + '<tbody>' + lignes + '</tbody></table>'
               : '<p class="vide">Aucune équipe.</p>')
            + '</div>';
  });
  document.getElementById('classement').innerHTML = sortie;

  var m = document.getElementById('maj');
  if (donnees.maj){
    var dt = new Date(donnees.maj);
    m.textContent = 'Mis à jour à ' + ('0'+dt.getHours()).slice(-2) + 'h'
                  + ('0'+dt.getMinutes()).slice(-2) + '. La page se rafraîchit toute seule.';
  } else {
    m.textContent = 'Les résultats s’afficheront ici au fil des vagues, dimanche 4 octobre.';
  }
}

function charger(){
  fetch('race4-resultats.json?t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){ donnees = d; peindre(); })
    .catch(function(){
      document.getElementById('maj').textContent =
        'Classement momentanément indisponible. Réessaie dans une minute.';
    });
}
charger();
setInterval(charger, 60000);   // le spectateur n'a rien à rafraîchir

// ── le mode televiseur ───────────────────────────────────────────────────────
// ?tv=1 : grand, sans navigation, sur deux colonnes. ?tv=1&defile=1 : une
// categorie a la fois, qui change toute seule. Personne ne touche a rien.
(function(){
  var q = new URLSearchParams(location.search);
  if (q.get('tv') !== '1') return;
  document.body.classList.add('tv');
  // Sur un televiseur, une categorie par page : lisible de loin, et on les
  // voit toutes passer. ?defile=0 remet les deux colonnes fixes.
  if (q.get('defile') === '0') return;
  document.body.classList.add('solo');
  var page = 0, pages = [];

  function placeDispo(){
    var z = document.getElementById('classement');
    return window.innerHeight - z.getBoundingClientRect().top - 26;
  }

  // Une categorie trop longue ne se tasse pas : elle se coupe en plusieurs
  // pages. On mesure les lignes a leur vraie taille, puis on remplit page par
  // page tant que ca rentre. Mieux vaut deux ecrans lisibles qu'un illisible.
  var MINI = +(q.get('mini') || 6);     // jamais moins de six equipes par ecran

  function decouper(){
    var cats = [].slice.call(document.querySelectorAll('#classement .cat'));
    if (!cats.length) return [];
    var dispo = placeDispo(), out = [];
    var z0 = document.getElementById('classement');
    z0.style.transform = 'none'; z0.style.width = '';   // on mesure a nu
    cats.forEach(function(c, ic){
      c.style.display = '';
      var lignes = [].slice.call(c.querySelectorAll('tbody tr'));
      lignes.forEach(function(l){ l.style.display = ''; });
      if (!lignes.length){ out.push({cat: ic, de: 0, a: 0, n: 1, sur: 1}); return; }
      var tete = c.getBoundingClientRect().height
               - lignes.reduce(function(h, l){
                   return h + l.getBoundingClientRect().height; }, 0);
      // Combien d'equipes tiennent a taille normale, et combien il en faut.
      var hauts = lignes.map(function(l){
        return l.getBoundingClientRect().height; });
      var tient = 0, cumul = tete;
      while (tient < lignes.length && cumul + hauts[tient] <= dispo){
        cumul += hauts[tient]; tient++;
      }
      tient = Math.max(1, tient);
      // On veut au moins MINI equipes a l'ecran : si elles ne rentrent pas a
      // taille normale, c'est l'image qui se reduit, pas la page qui se coupe.
      var vise = Math.min(lignes.length, Math.max(MINI, tient));
      var besoin = tete;
      for (var k = 0; k < vise; k++) besoin += hauts[k];
      var ech = besoin > dispo ? Math.max(.5, dispo / besoin) : 1;
      var lots = [], i0 = 0;
      while (i0 < lignes.length){
        lots.push([i0, Math.min(lignes.length, i0 + vise)]);
        i0 += vise;
      }
      // On sait maintenant combien de pages il faut : on repartit les equipes
      // a parts egales, pour ne pas finir sur une page a une seule ligne.
      var nb = lots.length, taille = Math.ceil(lignes.length / nb), i = 0;
      lots = [];
      while (i < lignes.length){
        lots.push([i, Math.min(lignes.length, i + taille)]);
        i += taille;
      }
      lots.forEach(function(x, k){
        out.push({cat: ic, de: x[0], a: x[1], n: k + 1, sur: lots.length,
                  ech: ech}); });
    });
    return out;
  }

  function montrer(){
    var cats = [].slice.call(document.querySelectorAll('#classement .cat'));
    if (!pages.length || !cats.length) return;
    page = page % pages.length;
    var p = pages[page];
    cats.forEach(function(c, i){ c.style.display = i === p.cat ? '' : 'none'; });
    var c = cats[p.cat];
    [].slice.call(c.querySelectorAll('tbody tr')).forEach(function(l, i){
      l.style.display = (i >= p.de && i < p.a) ? '' : 'none';
    });
    var z = document.getElementById('classement');
    z.style.transform = p.ech < 1 ? 'scale(' + p.ech.toFixed(3) + ')' : 'none';
    z.style.width = p.ech < 1 ? (100 / p.ech).toFixed(2) + '%' : '';
    var h2 = c.querySelector('h2');
    if (h2){
      var nom = h2.dataset.nom || (h2.dataset.nom = h2.textContent);
      h2.textContent = p.sur > 1 ? nom + '  ' + p.n + ' / ' + p.sur : nom;
    }
    page++;
  }

  function tourner(){ montrer(); }

  function recalculer(){
    var garde = pages[(page - 1 + Math.max(1, pages.length)) % Math.max(1, pages.length)];
    pages = decouper();
    if (garde){
      var i = pages.findIndex(function(x){
        return x.cat === garde.cat && x.de === garde.de; });
      page = i >= 0 ? i : 0;
    } else { page = 0; }
    montrer();
  }
  window.addEventListener('resize', recalculer);
  // Le classement se redessine tout seul : on remet la rotation en place apres.
  var peindreOrig = peindre;
  peindre = function(){ peindreOrig(); recalculer(); };
  recalculer();
  setInterval(tourner, +(q.get('secondes') || 15) * 1000);
})();
</script>
</body>
</html>
