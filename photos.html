<style>
 .wrap.large{max-width:1100px}
 .hero h1{font-size:clamp(44px,13vw,76px)}
 .intro{max-width:460px;margin:18px auto 0;font-size:15px;line-height:1.5;color:var(--soft);text-align:center}
 .compte{display:block;margin-top:6px;font-weight:800;font-size:11px;letter-spacing:4px;text-transform:uppercase;color:#fff}

 .grille{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:34px}
 @media (min-width:640px){.grille{grid-template-columns:repeat(3,1fr);gap:8px}}
 @media (min-width:960px){.grille{grid-template-columns:repeat(4,1fr)}}
 .vignette{position:relative;display:block;padding:0;border:0;margin:0;cursor:zoom-in;
  aspect-ratio:3/2;overflow:hidden;border-radius:4px;background:var(--fill);width:100%}
 .vignette img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s,transform .35s}
 .vignette img.ok{opacity:1}
 .vignette:hover img{transform:scale(1.04)}
 .vignette:focus-visible{outline:3px solid #fff;outline-offset:2px}
 .vignette .dl{position:absolute;right:6px;bottom:6px;width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;background:rgba(24,0,173,.82);border:1.5px solid rgba(255,255,255,.6);color:#fff}
 .vignette .dl svg{width:16px;height:16px}

 .plus{display:block;margin:26px auto 0;font-family:inherit;font-weight:900;font-size:12px;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--blue);background:#fff;border:0;border-radius:99px;padding:14px 26px;cursor:pointer}
 .plus[hidden]{display:none}

 /* Visionneuse plein écran */
 .vis{position:fixed;inset:0;z-index:50;background:#0b0640;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
 .vis[hidden]{display:none}
 .vis-haut{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;gap:12px}
 .vis-num{font-weight:800;font-size:12px;letter-spacing:2px;color:var(--soft);font-variant-numeric:tabular-nums}
 .rond{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--hair);background:transparent;color:#fff;
  display:grid;place-items:center;cursor:pointer;flex:none}
 .rond svg{width:20px;height:20px}
 .rond:focus-visible,.telecharger:focus-visible{outline:3px solid #fff;outline-offset:2px}
 .scene{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
 .scene img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;transition:opacity .2s}
 .scene img.charge{opacity:.35}
 .fleche{position:absolute;top:50%;transform:translateY(-50%);background:rgba(24,0,173,.6)}
 .fleche.g{left:12px} .fleche.d{right:12px}
 @media (hover:none){.fleche{display:none}}
 .vis-bas{padding:14px 16px 18px;display:flex;flex-direction:column;align-items:center;gap:8px}
 .telecharger{display:inline-flex;align-items:center;gap:10px;font-family:inherit;font-weight:900;font-size:14px;
  letter-spacing:1px;text-transform:uppercase;color:var(--blue);background:#fff;border:0;border-radius:99px;
  padding:15px 28px;cursor:pointer;min-width:240px;justify-content:center}
 .telecharger svg{width:18px;height:18px}
 .telecharger[disabled]{opacity:.7;cursor:wait}
 .astuce{font-size:12px;color:var(--soft2);text-align:center}
 body.fige{overflow:hidden}
 @media (prefers-reduced-motion:reduce){.vignette img,.scene img{transition:none}}
</style>
</head>

    b.type = 'button'; b.className = 'vignette'; b.dataset.i = i;
    b.setAttribute('aria-label', 'Agrandir la photo ' + (i + 1));
    const im = new Image();
    im.loading = 'lazy'; im.decoding = 'async'; im.alt = '';
    im.src = img(IDS[i], 520);
    im.onload = () => im.classList.add('ok');
    b.append(im);
    b.insertAdjacentHTML('beforeend', '<span class="dl" aria-hidden="true">' + ICONE_DL + '</span>');
    frag.append(b);
  }
  grille.append(frag);
  affichees = fin;
  plus.hidden = affichees >= IDS.length;
}
plus.onclick = afficherSuite;
grille.onclick = e => { const b = e.target.closest('.vignette'); if (b) ouvrir(+b.dataset.i); };
// La suite se charge toute seule quand on arrive en bas.
new IntersectionObserver(es => { if (es[0].isIntersecting && affichees < IDS.length) afficherSuite(); },
  { rootMargin: '600px' }).observe(plus);
afficherSuite();

// Visionneuse
const vis = document.getElementById('vis'), grande = document.getElementById('grande'),
      num = document.getElementById('num'), btn = document.getElementById('telecharger'),
      libelle = btn.querySelector('span');
let courant = 0, dernierFocus = null;
const largeur = () => Math.min(2000, Math.round(Math.max(innerWidth, innerHeight) * (devicePixelRatio || 1)));
function montrer(i) {
  courant = (i + IDS.length) % IDS.length;
  num.textContent = (courant + 1) + ' / ' + IDS.length;
  grande.classList.add('charge');
  grande.onload = () => grande.classList.remove('charge');
  grande.src = img(IDS[courant], largeur());
  grande.alt = 'Hygie Race 4, photo ' + (courant + 1);
  // précharge la suivante
  new Image().src = img(IDS[(courant + 1) % IDS.length], largeur());
}
function ouvrir(i) {
  dernierFocus = document.activeElement;
  vis.hidden = false; document.body.classList.add('fige');
  montrer(i);
  history.pushState({ photo: 1 }, '');
  document.getElementById('fermer').focus();
}
function fermer(depuisHistorique) {
  if (vis.hidden) return;
  vis.hidden = true; document.body.classList.remove('fige');
  if (!depuisHistorique && history.state && history.state.photo) history.back();
  if (dernierFocus) dernierFocus.focus();
}
// Le bouton « retour » du téléphone ferme la photo au lieu de quitter la page.
addEventListener('popstate', () => fermer(true));
document.getElementById('fermer').onclick = () => fermer();
document.getElementById('prec').onclick = () => montrer(courant - 1);
document.getElementById('suiv').onclick = () => montrer(courant + 1);
addEventListener('keydown', e => {
  if (vis.hidden) return;
  if (e.key === 'Escape') fermer();
  if (e.key === 'ArrowLeft') montrer(courant - 1);
  if (e.key === 'ArrowRight') montrer(courant + 1);
});
let x0 = null, y0 = null;
const scene = document.getElementById('scene');
scene.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
scene.addEventListener('touchend', e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) montrer(courant + (dx < 0 ? 1 : -1));
  x0 = null;
});

// Téléchargement : sur téléphone, la feuille de partage propose « Enregistrer l'image » (pellicule).
btn.onclick = async () => {
  const id = IDS[courant], nom = 'Hygie-Race-4-' + NOMS[courant] + '.jpg';
  btn.disabled = true; libelle.textContent = 'Préparation…';
  try {
    const r = await fetch(`https://lh3.googleusercontent.com/d/${id}=s0`);
    if (!r.ok) throw 0;
    const blob = await r.blob();
    const fichier = new File([blob], nom, { type: 'image/jpeg' });
    const mobile = matchMedia('(hover:none)').matches;
    if (mobile && navigator.canShare && navigator.canShare({ files: [fichier] })) {
      try { await navigator.share({ files: [fichier] }); } catch (e) {}
    } else {
      const url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = nom; document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }
  } catch (e) {
    location.href = `https://drive.usercontent.google.com/download?id=${id}&export=download`;
  } finally {
    btn.disabled = false; libelle.textContent = 'Télécharger';
  }
};
</script>
